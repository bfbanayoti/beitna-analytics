<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6efe6">
<title>Beitna Analytics</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Lock screen: the only plaintext part of this site. The dashboard is AES-GCM ciphertext in PAYLOAD. */
:root{--bg:oklch(95.6% .018 75);--ink:oklch(21% .02 50);--ink-2:oklch(21% .02 50/.6);--hairline:oklch(21% .02 50/.1);--fill:oklch(40% .03 60/.08);
  --clay:oklch(50% .125 34);--clay-2:oklch(42% .115 31);--danger:oklch(58% .2 25);--glass:rgb(255 255 255/.58);--rim:rgb(255 255 255/.85);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(16% .012 50);--ink:oklch(96% .01 80);--ink-2:oklch(96% .01 80/.6);--hairline:oklch(96% .01 80/.12);
  --fill:oklch(96% .01 80/.08);--glass:rgb(255 255 255/.07);--rim:rgb(255 255 255/.2);--danger:oklch(70% .18 25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:oklch(16% .012 50);--ink:oklch(96% .01 80);--ink-2:oklch(96% .01 80/.6);--hairline:oklch(96% .01 80/.12);
  --fill:oklch(96% .01 80/.08);--glass:rgb(255 255 255/.07);--rim:rgb(255 255 255/.2);--danger:oklch(70% .18 25);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 20px}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(70% 50% at 85% 5%,oklch(78% .12 45/.6),transparent 70%),radial-gradient(60% 45% at 5% 45%,oklch(85% .08 150/.5),transparent 70%),radial-gradient(80% 55% at 90% 100%,oklch(85% .1 80/.55),transparent 70%)}
main{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
img{width:76px;height:76px;border-radius:21px;box-shadow:0 16px 36px oklch(45% .13 35/.35)}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
form{width:100%;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--rim),0 24px 60px oklch(30% .04 50/.14)}
input[type=password]{width:100%;height:52px;border-radius:15px;border:.5px solid var(--hairline);background:var(--fill);color:var(--ink);font:inherit;font-size:17px;padding:0 16px;outline:none}
input:focus{box-shadow:0 0 0 3px oklch(60% .145 40/.25)}
button{height:52px;border:0;border-radius:999px;font:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,var(--clay),var(--clay-2));box-shadow:inset 0 1px 0 rgb(255 255 255/.2)}
button[disabled]{opacity:.7}
label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink-2)}label input{width:17px;height:17px;accent-color:var(--clay)}
.err{min-height:20px;margin:0;font-size:14px;font-weight:600;color:var(--danger)}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
</style></head><body>
<main id="lock" hidden><img src="logo.svg" alt=""><div><h1>Beitna Analytics</h1><p>Enter the password to continue</p></div>
 <form id="f"><input type="text" name="username" value="beitna-analytics" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
  <button id="go">Unlock</button><label><input type="checkbox" id="rem" checked>Remember this device</label></form>
 <p class="err" id="err" role="alert"></p></main>
<script>
(()=>{ // own scope: the dashboard is written into this same window
const PAYLOAD={"v":1,"iter":310000,"kid":"test","iv":"WnL1fCe02tYvh0k6","ct":"kCuecwItbKBo7arzyO2xjw/gZJ+RWGewmgXUVibOjIhuJqVOUdvTs4x3NhPPUSrv/i15kYpXz6Sws5K7BipsJI0Usxrr6soTrg5S9AQzW9U776v3JCLcpMhB","salt":"dS/PUqk0WkF9iDV8T3/NHw==","wiv":"vftJOL+6ec9H4Z1z","key":"UeitNwmW+V3qJOSo8fq7mFLL7qSDk9vnPlDwTZtHaV9jIjnfgPaNByepRBb11x4R"},K='beitna-analytics:gate-test';
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),$=id=>document.getElementById(id);
async function open(raw,keep){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(PAYLOAD.iv)},key,unb64(PAYLOAD.ct)));
 try{(keep?localStorage:sessionStorage).setItem(K,JSON.stringify({kid:PAYLOAD.kid,k:b64(raw)}))}catch(e){}
 document.open();document.write(html);document.close()}
$('f').onsubmit=async e=>{e.preventDefault();const pw=$('pw').value.trim();if(!pw)return;$('go').disabled=true;$('err').textContent='';
 try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(PAYLOAD.wiv)},kek,unb64(PAYLOAD.key));return await open(raw,$('rem').checked)}
 catch(_){$('go').disabled=false;$('err').textContent='Incorrect password';const f=$('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('pw').select()}};
(async()=>{if(!PAYLOAD||!crypto.subtle){$('lock').hidden=false;$('err').textContent='This page needs a secure (https) connection.';return}
 for(const st of[localStorage,sessionStorage]){let a;try{a=JSON.parse(st.getItem(K))}catch(e){}
  if(a&&a.kid===PAYLOAD.kid){try{return await open(unb64(a.k),st===localStorage)}catch(e){}}try{st.removeItem(K)}catch(e){}}
 $('lock').hidden=false;setTimeout(()=>$('pw').focus(),300)})();
})();
</script></body></html>
